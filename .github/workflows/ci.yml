name: Validate

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'src-tauri/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['frontend/**', 'src-tauri/**', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      full:
        description: 'Also compile and test the Rust backend on Linux'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check frontend JavaScript syntax
        run: git ls-files -z 'frontend/*.js' | xargs -0 -r -n 1 node --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate application manifests
        run: |
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          json.loads(Path('src-tauri/tauri.conf.json').read_text())
          tomllib.loads(Path('src-tauri/Cargo.toml').read_text())
          PY

  test:
    needs: quick
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || inputs.full
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
